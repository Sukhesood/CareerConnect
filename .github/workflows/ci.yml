name: CareerConnect CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: career_connect_app/pom.xml

      - name: Run tests
        working-directory: career_connect_app
        run: mvn --batch-mode test

      - name: Build application
        working-directory: career_connect_app
        run: mvn --batch-mode package -DskipTests
