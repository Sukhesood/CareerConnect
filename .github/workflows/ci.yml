name: CareerConnect CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: career_connect_app/pom.xml

      - name: Run tests
        working-directory: career_connect_app
        run: mvn --batch-mode test

      - name: Build application and generate PMD report
        working-directory: career_connect_app
        run: mvn --batch-mode verify -DskipTests

      - name: Upload static-analysis report
        uses: actions/upload-artifact@v4
        with:
          name: pmd-static-analysis-report
          path: career_connect_app/target/pmd.xml
          if-no-files-found: error
