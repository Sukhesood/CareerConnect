
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>CareerConnect - Login</title>

    <link rel="icon" type="image/png"
          th:href="@{/images/logo-mark.png}">

    <link rel="stylesheet"
          th:href="@{/css/layout.css}">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">
</head>

<body class="auth-page">

    <!-- Common Header -->
    <header th:replace="~{fragments :: header}"></header>

    <main class="auth-main">

        <div class="auth-card">

            <h2>Welcome Back</h2>

            <p class="auth-description">
                Log in to your CareerConnect account.
            </p>

            <!-- Incorrect email or password -->
            <div th:if="${loginError}"
                 class="auth-message auth-error"
                 th:text="${loginError}">
            </div>

            <!-- Successful password reset -->
            <div th:if="${param.resetSuccess}"
                 class="auth-message auth-success">
                Your password has been updated successfully.
                Please log in with your new password.
            </div>

            <form th:action="@{/login}" method="post">

                <!-- Email -->
                <div class="auth-form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="user@example.com"
                           autocomplete="email"
                           required>

                </div>

                <!-- Password -->
                <div class="auth-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>

                </div>

                <!-- Forgot Password -->
                <div class="forgot-password-link">
                    <a th:href="@{/forgot-password}">
                        Forgot password?
                    </a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>

            <!-- Registration -->
            <div class="auth-footer-link">
                First time user?
                <a th:href="@{/register}">
                    Create an account
                </a>
            </div>

        </div>

    </main>

    <!-- Common Footer -->
    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
