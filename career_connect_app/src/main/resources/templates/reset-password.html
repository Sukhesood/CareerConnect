
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="referrer" content="no-referrer">

    <title>CareerConnect - Reset Password</title>

    <link rel="icon" type="image/png"
          th:href="@{/images/logo-mark.png}">

    <link rel="stylesheet"
          th:href="@{/css/layout.css}">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">
</head>

<body class="auth-page">

    <!-- Common Header -->
    <header th:replace="~{fragments :: header}"></header>

    <main class="auth-main">

        <div class="auth-card">

            <h2>Create New Password</h2>

            <p class="auth-description">
                Please enter and confirm your new password.
            </p>

            <!-- Error Message -->
            <div th:if="${error}"
                 class="auth-message auth-error"
                 th:text="${error}">
            </div>

            <!-- Invalid or Expired Token -->
            <div th:unless="${valid}"
                 class="auth-message auth-error">

                Your password reset link is invalid,
                expired, or has already been used.

                Please request a new link.

            </div>

            <!-- Password Reset Form -->
            <form th:if="${valid}"
                  th:action="@{/reset-password}"
                  method="post">

                <!-- Reset Token -->
                <input type="hidden"
                       name="token"
                       th:value="${token}">

                <!-- New Password -->
                <div class="auth-form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter new password"
                           minlength="8"
                           autocomplete="new-password"
                           required>

                </div>

                <!-- Confirm Password -->
                <div class="auth-form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Confirm new password"
                           minlength="8"
                           autocomplete="new-password"
                           required>

                </div>

                <p class="password-hint">
                    Your password must contain
                    at least 8 characters.
                </p>

                <button type="submit"
                        class="auth-btn">

                    Reset Password

                </button>

            </form>

            <div class="auth-footer-link">

                <a th:href="@{/forgot-password}">
                    Request Another Reset Link
                </a>

            </div>

        </div>

    </main>

    <!-- Common Footer -->
    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
