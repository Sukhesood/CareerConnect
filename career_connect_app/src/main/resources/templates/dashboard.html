
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Dashboard - CareerConnect</title>

    <link rel="icon"
          type="image/png"
          th:href="@{/images/logo-mark.png}">

    <link rel="stylesheet"
          th:href="@{/css/layout.css}">

    <style>
        .main-content {
            flex: 1;
            padding: 50px 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h2 {
            color: var(--text-main);
            margin-top: 0;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.5;
        }

        .profile-btn {
            display: inline-block;
            background: var(--blue-deep);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .profile-btn:hover {
            background: var(--blue-mid);
        }
    </style>
</head>

<body>

    <!-- COMMON HEADER -->
    <header th:replace="~{fragments :: header}">
    </header>

    <!-- DASHBOARD CONTENT -->
    <main class="main-content">

        <div class="card">

            <h2>Welcome to your Dashboard</h2>

            <p>
                You have successfully authenticated
                into the CareerConnect portal.
            </p>

            <p style="margin-top: 10px;">
                Manage your personal information
                and upload your resumes via
                your profile page.
            </p>

            <a th:href="@{/profile}"
               class="profile-btn">
                Go to My Profile
            </a>

        </div>

    </main>

    <!-- COMMON FOOTER -->
    <footer th:replace="~{fragments :: footer}">
    </footer>

</body>
</html>
