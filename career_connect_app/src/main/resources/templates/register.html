<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CareerConnect - Register</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-mark.png}">

    <style>

        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #202124;
            --text-secondary: #5f6368;
            --line: #d3deec;
            --border-color: #dadce0;
        }
        .wrap { max-width: 1080px; padding: 0 24px; }


        body { font-family: "Trebuchet MS", 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: var(--ink); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--white); border-bottom: 1px solid var(--line); }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            height: 72px;
        }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--blue-deep); }
        .brand img { height: 38px; width: auto; display: block; }
        .brand span { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; }

        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .form-card { background: white; padding: 35px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; color: #444; font-size: 13px; }
        input, select { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: #1a73e8; outline: none; }
        .error { color: #d93025; font-size: 11px; margin-top: 2px; }
        button { width: 100%; background: #1a73e8; color: white; border: none; padding: 11px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #1557b0; }
        .success { color: #137333; background: #e6f4ea; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 13px; }
        .footer-link { text-align: center; margin-top: 15px; font-size: 14px; color: #555; }
        .footer-link a { color: #1a73e8; text-decoration: none; font-weight: bold; }
        .footer-link a:hover { text-decoration: underline; }
        footer { background: #202124; color: #bdc1c6; text-align: center; padding: 20px; font-size: 13px; }
        footer .footer-links { margin-bottom: 8px; }
        footer .footer-links a { color: #8ab4f8; text-decoration: none; margin: 0 10px; }
        footer .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div class="wrap header-inner">
            <a class="brand" th:href="@{/}" aria-label="CareerConnect home">
                <img th:src="@{/images/logo-mark.png}" alt="">
                <span>CareerConnect</span>
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="form-card">
            <h2>Create Account</h2>
            
            <div th:if="${param.success}" class="success">
                Registration successful! <a th:href="@{/login}">Login here</a>
            </div>
            
            <div th:if="${emailError}" class="error" style="text-align: center; margin-bottom: 10px;" th:text="${emailError}"></div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                
                <div class="form-group">
                    <label>First Name:</label>
                    <input type="text" th:field="*{firstName}" />
                    <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>

                <div class="form-group">
                    <label>Last Name:</label>
                    <input type="text" th:field="*{lastName}" />
                    <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>

                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="text" th:field="*{phoneNumber}" placeholder="e.g., 514-555-0199" />
                    <div class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                </div>

                <div class="form-group">
                    <label>Address:</label>
                    <input type="text" th:field="*{address}" placeholder="e.g., 1250 Guy St, Montreal" />
                    <div class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="form-group">
                    <label>Email ID:</label>
                    <input type="email" th:field="*{email}" placeholder="user@example.com" />
                    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" th:field="*{password}" placeholder="At least 6 characters" />
                    <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="form-group">
                    <label>Account Type:</label>
                    <select th:field="*{role}">
                        <option value="JOB_SEEKER">Job Seeker</option>
                        <option value="RECRUITER">Recruiter</option>
                    </select>
                </div>

                <button type="submit">Register</button>
            </form>

            <div class="footer-link">
                Already have an account? <a th:href="@{/login}">Login here</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="#">About Us</a> | 
            <a href="#">Contact Support</a> | 
            <a href="#">Privacy Policy</a> | 
            <a href="#">Terms of Service</a>
        </div>
        <div>&copy; 2026 CareerConnect. SOEN 341 Project.</div>
    </footer>

</body>
</html>
