
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>CareerConnect - Forgot Password</title>

    <link rel="icon" type="image/png"
          th:href="@{/images/logo-mark.png}">

    <link rel="stylesheet"
          th:href="@{/css/layout.css}">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">
</head>

<body class="auth-page">

    <!-- Common Header -->
    <header th:replace="~{fragments :: header}"></header>

    <main class="auth-main">

        <div class="auth-card">

            <h2>Forgot Password?</h2>

            <p class="auth-description">
                Enter your registered email address.
                We will send you a secure link
                to reset your password.
            </p>

            <!-- Confirmation -->
            <div th:if="${param.sent}"
                 class="auth-message auth-success">

                If an account exists with this email,
                you will receive a password reset link.

                Please check your inbox.

            </div>

            <!-- Email Form -->
            <form th:action="@{/forgot-password}"
                  method="post">

                <div class="auth-form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           autocomplete="email"
                           maxlength="254"
                           required>

                </div>

                <button type="submit"
                        class="auth-btn">

                    Send Reset Link

                </button>

            </form>

            <div class="auth-footer-link">

                <a th:href="@{/login}">
                    Back to Login
                </a>

            </div>

        </div>

    </main>

    <!-- Common Footer -->
    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
