<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CareerConnect - My Applications</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-mark.png}">
    <style>
        :root { --blue: #2f5f96; --blue-light: #eaf1f8; --page: #f8f9fa; --text: #202124; --muted: #5f6368; --border: #d3deec; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--page); color: var(--text); font-family: "Trebuchet MS", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        header { height: 72px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; background: white; border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 12px; color: var(--blue); text-decoration: none; font-size: 21px; font-weight: 800; }
        .brand img { height: 38px; }
        .nav-link { color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: none; }
        .nav-link:hover { color: var(--blue); }
        main { max-width: 1080px; margin: 0 auto; padding: 48px 24px 64px; }
        h1 { margin: 0 0 10px; font-size: 34px; }
        .intro { margin: 0 0 32px; color: var(--muted); font-size: 16px; }
        .application-list { display: grid; gap: 18px; }
        .application-card { padding: 24px; background: white; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 2px 8px rgba(20, 37, 59, 0.05); }
        .application-header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
        h2 { margin: 0 0 6px; color: var(--blue); font-size: 22px; }
        .company { margin: 0; font-weight: 700; }
        .status { padding: 6px 10px; white-space: nowrap; border-radius: 16px; background: var(--blue-light); color: var(--blue); font-size: 13px; font-weight: 700; }
        .date { margin: 16px 0 0; color: var(--muted); font-size: 14px; }
        .empty-state { padding: 32px; text-align: center; background: white; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); }
        .empty-state h2 { color: var(--text); }
        @media (max-width: 600px) { header { padding: 0 20px; } main { padding: 32px 18px; } .application-header { flex-direction: column; } }
    </style>
</head>
<body>
<header>
    <a class="brand" th:href="@{/}" aria-label="CareerConnect home"><img th:src="@{/images/logo-mark.png}" alt=""><span>CareerConnect</span></a>
    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
</header>
<main>
    <h1>My Applications</h1>
    <p class="intro">Review the jobs you have applied to and their current status.</p>
    <section class="application-list" aria-label="Submitted applications">
        <article class="application-card" th:each="application : ${applications}">
            <div class="application-header"><div><h2 th:text="${application.jobListing.title}">Job title</h2><p class="company" th:text="${application.jobListing.companyName}">Company</p></div><span class="status" th:text="${application.status}">Applied</span></div>
            <p class="date">Applied <span th:text="${#temporals.format(application.submittedAt, 'MMMM d, yyyy')}">January 1, 2026</span></p>
        </article>
        <div class="empty-state" th:if="${#lists.isEmpty(applications)}"><h2>No applications yet</h2><p>When you apply to a job, it will appear here.</p></div>
    </section>
</main>
</body>
</html>
